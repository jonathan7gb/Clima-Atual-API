<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previsão do Tempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="body">
    <!-- HEADER DO SITE -->
    <header class="p-4 py-8 md:p-8 bg-sky-500 text-white text-center" id="header">
        <div>
            <h1 class="text-white font-bold text-3xl flex items-center justify-center gap-4">
                UBER'S WHEATER APP
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cloudy-icon lucide-cloudy text-yellow-400"><path d="M17.5 21H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M22 10a3 3 0 0 0-3-3h-2.207a5.502 5.502 0 0 0-10.702.5"/></svg>
            </h1>
        </div>    
    </header>

    <main class="flex flex-col justify-self-center justify-center items-center mt-8 lg:min-w-[800px] lg:mx-[4rem] md:mx-[2rem] md:min-w-[700px] sm:mx-[1rem] sm:max-w-sm">
        <!-- SEÇÃO PARA PESQUISA DA CIDADE -->
        <section class="w-full">
            <h1 class="mb-2 font-bold text-xl" id="tituloPesquisa">Pesquisar Cidade</h1>
            <form action="" class="w-full flex flex-row gap-2 justify-between">
                <input type="text" id="cidadeInput" placeholder="Digite o nome da cidade" class="w-full border p-2 rounded">
                <button type="submit" class="bg-sky-500 text-white font-semibold p-2 rounded hover:bg-sky-600" id="botaoSubmit">Pesquisar</button>
            </form>
        </section>

        <!-- SEÇÃO ONDE MOSTRA OS DETALHES DO CLIMA DA CIDADE -->
        <section class="mt-4 w-full">
            <div class="p-4 rounded-xl flex flex-col  gap-3 cardClima" id="cardClima">
                <div id="iconeDia" class="text-white flex flex-row gap-2 ">
                    
                </div>
                <h2 class="text-2xl font-semibold text-white justify-center"><span  id="nomeCidade">Jaraguá do Sul</span>, <span id="paisCidade"></span> (<span id="horario"></span>)</h2>
                <h3 class="text-6xl font-bold text-white justify-center"><span id="temperaturaCidade">0</span> ºC</h3>
                <p>Sensação térmica de <span id="sensacaoTermica"></span> ºC</p>
                <div class="bg-amber-300 p-2 text-black rounded-xl">
                    <p class="font-semibold w-full" id="mensagemEspecial"></p>
                </div>
            </div>
        </section>

        <!-- SEÇÃO ONDE MOSTRA CLIMA NOS PRÓXIMOS DIAS -->
        <section class="w-full mt-2">
            <h1 class="text-xl text-white font-bold mt-4 mb-2">Próximos 5 dias:</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">


                <div class="p-4 rounded text-center proximoDia flex justify-center flex-col gap-4">
                    <p class="text-white font-medium"><span>Qua.</span></p>
                     <div id="iconClima" class="justify-center flex items-center flex-col"><svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(85.2% 0.199 91.936)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></div>
                     <div class="flex flex-row justify-center gap-2 items-end">
                         <p class="font-medium text-white text-xl"><span>25</span>°C</p>
                        <p class="text-stone-200 text-md"><span>12</span>°C</p>
                        
                     </div>   
                </div>
                <div class="p-4 rounded text-center proximoDia flex justify-center flex-col gap-4">
                    <p class="text-white font-medium"><span>Qui.</span></p>
                     <div id="iconClima" class="justify-center flex items-center flex-col"><svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(85.2% 0.199 91.936)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></div>
                     <div class="flex flex-row justify-center gap-2 items-end">
                         <p class="font-medium text-white text-xl"><span>25</span>°C</p>
                        <p class="text-stone-200 text-md"><span>12</span>°C</p>
                        
                     </div>   
                </div>
                <div class="p-4 rounded text-center proximoDia flex justify-center flex-col gap-4">
                    <p class="text-white font-medium"><span>Sex.</span></p>
                     <div id="iconClima" class="justify-center flex items-center flex-col"><svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(85.2% 0.199 91.936)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></div>
                     <div class="flex flex-row justify-center gap-2 items-end">
                         <p class="font-medium text-white text-xl"><span>25</span>°C</p>
                        <p class="text-stone-200 text-md"><span>12</span>°C</p>
                        
                     </div>   
                </div>
                <div class="p-4 rounded text-center proximoDia flex justify-center flex-col gap-4">
                    <p class="text-white font-medium"><span>Sab.</span></p>
                     <div id="iconClima" class="justify-center flex items-center flex-col"><svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(85.2% 0.199 91.936)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></div>
                     <div class="flex flex-row justify-center gap-2 items-end">
                         <p class="font-medium text-white text-xl"><span>25</span>°C</p>
                        <p class="text-stone-200 text-md"><span>12</span>°C</p>
                        
                     </div>   
                </div>
                <div class="p-4 rounded text-center proximoDia flex justify-center flex-col gap-4">
                    <p class="text-white font-medium"><span>Dom.</span></p>
                     <div id="iconClima" class="justify-center flex items-center flex-col"><svg xmlns="http://www.w3.org/2000/svg" width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="oklch(85.2% 0.199 91.936)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sun-icon lucide-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></div>
                     <div class="flex flex-row justify-center gap-2 items-end">
                         <p class="font-medium text-white text-xl"><span>25</span>°C</p>
                        <p class="text-stone-200 text-md"><span>12</span>°C</p>
                        
                     </div>   
                </div>
               




            </div>
        </section>
    </main>


    <script src="script.js"></script>
</body>
</html>
